<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pebble</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .graphite { fill: var(--graphite); }
  .ink { fill: var(--ink); }
  .soft { fill: var(--graphite-soft); }
  .rule { fill: var(--line-strong); }
  .slab { rx: var(--radius-xl); }
  .dot { fill: var(--graphite); }
  .dot.cut { fill: var(--graphite-soft); }
  .words { position: absolute; left: var(--space-10); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-size: 112px; line-height: .92; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      graphite 160×256 slab bled off the top (the one accent, largest) · graphite-soft 112×208 pill (the relief tint) · ink disc ⌀144 · line-strong 128×40 pill — monochrome, as the brand is
  arrangement one tall graphite slab with satellites stepping right, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     discs, from "pressed out of or into the surface … large radii": ⌀12 discs at a space-6 pitch down the soft pill, three cut into the slab in graphite-soft
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; slab corners radius-xl; pills rx = half the short side (radius-pill)
-->
<rect class="graphite slab" x="24" y="-40" width="160" height="296" rx="40"/>
<rect class="soft" x="200" y="56" width="112" height="200" rx="56"/>
<circle class="ink" cx="392" cy="112" r="72"/>
<rect class="rule" x="336" y="216" width="128" height="40" rx="20"/>
<circle class="dot cut" cx="80" cy="216" r="6"/>
<circle class="dot cut" cx="104" cy="216" r="6"/>
<circle class="dot cut" cx="128" cy="216" r="6"/>
<circle class="dot" cx="232" cy="96" r="6"/><circle class="dot" cx="256" cy="96" r="6"/><circle class="dot" cx="280" cy="96" r="6"/>
<circle class="dot" cx="232" cy="120" r="6"/><circle class="dot" cx="256" cy="120" r="6"/><circle class="dot" cx="280" cy="120" r="6"/>
<circle class="dot" cx="232" cy="144" r="6"/><circle class="dot" cx="256" cy="144" r="6"/><circle class="dot" cx="280" cy="144" r="6"/>
<circle class="dot" cx="232" cy="168" r="6"/><circle class="dot" cx="256" cy="168" r="6"/><circle class="dot" cx="280" cy="168" r="6"/>
<circle class="dot" cx="232" cy="192" r="6"/><circle class="dot" cx="256" cy="192" r="6"/><circle class="dot" cx="280" cy="192" r="6"/>
<circle class="dot" cx="232" cy="216" r="6"/><circle class="dot" cx="256" cy="216" r="6"/><circle class="dot" cx="280" cy="216" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Pebble</h1>
<p class="tag">One soft material, one light, quiet grey type.</p>
</div>
</div>
</body>
</html>
