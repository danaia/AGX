<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div id="root" class="pb-demo"></div>
<script>
  var P = window.Pebble, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.Card, { title: 'Price Range', style: { width: 260 } }, 'Raised: the default container.'),
      h(P.Card, { variant: 'inset', style: { width: 220 } }, h('div', { className: 'pb-card-title' }, 'Inset'), h('div', { className: 'pb-card-body' }, 'Pressed in — summaries, wells.')),
      h(P.Card, { variant: 'graphite', eyebrow: 'Balance', title: '$ 670', style: { width: 220 } }, 'The one dark tile on a page.'))
  );
</script>
</body>
</html>
