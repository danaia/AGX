<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pebble — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
</head>
<body>
<div id="root" class="pb-demo"></div>
<script>
  var P = window.Pebble, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { width: 380 } }, h(P.Card, { variant: 'hero' },
      h('h1', { style: { fontSize: 32, fontWeight: 600, textAlign: 'center', margin: '0 0 24px' } }, 'Login'),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
        h(P.TextField, { label: 'Username', placeholder: 'Username' }),
        h(P.TextField, { label: 'Password', type: 'password', placeholder: '••••••••' })),
      h('div', { style: { display: 'flex', justifyContent: 'center', marginTop: 28 } }, h(P.Button, null, 'Login'))))
  );
</script>
</body>
</html>
