[package]
name = "agx-gui"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
build = "build.rs"

# Standalone on purpose: the Buildroot package builds `--workspace`, and the
# GUI needs extra native libraries (libinput, xkbcommon, DRM). It joins the
# image build once those packages are enabled.
[workspace]

[[bin]]
name = "agx-gui"
path = "src/main.rs"

[features]
# Preview on a desktop (Wayland/X11) window.
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg", "slint/renderer-software"]
# Appliance mode: draw straight to DRM/KMS with libinput. No display server.
kms = ["dep:glow", "dep:libloading", "dep:input", "slint/unstable-libinput-09", "slint/backend-linuxkms-noseat", "slint/renderer-femtovg", "slint/renderer-software"]

[dependencies]
serde_json = "1"
png = "0.18"
sha2 = "0.10"
glow = { version = "=0.18.0", optional = true }
libloading = { version = "=0.8.9", optional = true }
input = { version = "=0.10.0", optional = true, default-features = false, features = ["libinput_1_19"] }
agx-core = { path = "../agx-core" }
agx-profile = { path = "../agx-profile" }
agx-bluetooth = { path = "../agx-bluetooth" }
zeroize = "1"
libc = "0.2"
signal-hook = "0.3"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }

[build-dependencies]
slint-build = "1.18.1"
